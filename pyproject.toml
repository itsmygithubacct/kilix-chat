[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kilix-chat"
version = "0.1.0"
description = "Chat with local models, including text diffusion GGUFs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "itsmygithubacct", email = "itsmygithubacct@users.noreply.github.com" }]
keywords = ["chat", "diffusion", "llama.cpp", "kilix"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
kilix-chat = "kilix_chat.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kilix_chat = ["py.typed"]
